<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お誕生日新聞 — 生まれた日の新聞をつくる</title>
<meta name="description" content="生年月日を入れるだけで、生まれた日のニュースと写真でつくるA3の誕生日新聞。PDFにしてコンビニで印刷できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22201C;--paper:#FFFDF9;--ground:#F6F1E6;--sub:#5A544A;--accent:#A3241B;--gold:#B08A3E}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
header{padding:28px 24px 16px;border-bottom:3px double var(--ink);display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px}
.daiji{background:var(--accent);color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:18px;line-height:1.05;padding:6px 8px;text-align:center}
.brand h1{margin:0;font-family:'Shippori Mincho B1',serif;font-size:22px}
.lead{margin:0;font-size:13px;color:var(--sub);line-height:1.7}
form{flex:1;padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:14px;font-weight:700}
.opt{font-weight:400;color:var(--sub);font-size:12px}
input,textarea{width:100%;border:1.5px solid var(--ink);background:#fff;padding:0 12px;font-size:16px;font-family:inherit;color:var(--ink)}
input{height:48px}
textarea{padding:10px 12px;height:96px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:1px}
.lbl{font-size:14px;font-weight:700}
.ymd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel.y{grid-column:1/-1}
.sel{position:relative;display:block}
.sel select{width:100%;height:48px;border:1.5px solid var(--ink);background:#fff;padding:0 28px 0 10px;font-size:16px;font-family:inherit;color:var(--ink);-webkit-appearance:none;appearance:none;border-radius:0}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select:focus{outline:3px solid var(--gold);outline-offset:1px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
.err{font-size:13px;color:var(--accent);font-weight:700;min-height:1em}
button{height:54px;background:var(--accent);color:#fff;border:none;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
button:hover{background:#8a1e17}
.how{padding:0 24px 28px;font-size:13px;line-height:1.8;color:var(--sub)}
.how h2{font-size:14px;color:var(--ink);margin:0 0 4px}
.how ol{margin:0;padding-left:20px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="daiji">誕生<br>日報</div><h1>お誕生日新聞</h1></div>
  <p class="lead">生年月日を入れるだけで、その日のニュースと写真でつくるA3の記念新聞。大切な人への誕生日プレゼントに。</p>
</header>

<form id="f" novalidate>
  <div class="field">
    <label for="n">主役のお名前</label>
    <input id="n" name="n" type="text" maxlength="20" placeholder="山田 花子" autocomplete="off" required>
  </div>
  <div class="field">
    <span class="lbl" id="dlbl">生年月日</span>
    <div class="ymd" role="group" aria-labelledby="dlbl">
      <label class="sel y"><span class="vh">年</span><select id="by" aria-label="生まれた年"></select></label>
      <label class="sel"><span class="vh">月</span><select id="bm" aria-label="生まれた月"></select></label>
      <label class="sel"><span class="vh">日</span><select id="bd" aria-label="生まれた日"></select></label>
    </div>
    <span class="hint">1970〜2025年生まれに対応しています</span>
  </div>
  <div class="field">
    <label for="i">主役のひとこと紹介 <span class="opt">任意・100字まで</span></label>
    <textarea id="i" name="i" maxlength="100" placeholder="小さいころから本が大好き。いまは二児の母として毎日大忙し。"></textarea>
    <span class="hint">紙面の「誕生日によせて」欄に入ります</span>
  </div>
  <div class="field">
    <label for="m">お祝いのメッセージ <span class="opt">任意・160字まで</span></label>
    <textarea id="m" name="m" maxlength="160" placeholder="お誕生日おめでとう！これからもよろしくね"></textarea>
  </div>
  <div class="field">
    <label for="fr">贈り主のお名前 <span class="opt">任意</span></label>
    <input id="fr" name="f" type="text" maxlength="20" placeholder="家族一同" autocomplete="off">
  </div>
  <p class="err" id="err" role="alert"></p>
  <button type="submit">紙面をつくる</button>
</form>

<section class="how">
  <h2>印刷のしかた</h2>
  <ol>
    <li>紙面ができたら「印刷・PDF保存」を押す</li>
    <li>用紙はA3・縦、倍率は100%（実際のサイズ）、余白なしでPDFに保存</li>
    <li>PDFをコンビニのネットプリントに登録して、A3・カラーで印刷</li>
  </ol>
</section>
</div>
<script>
(function () {
  var f = document.getElementById('f'), err = document.getElementById('err');
  var avail = null;
  fetch('data/index.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
    .then(function (j) { avail = j; }).catch(function () {});
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var MIN_Y = 1970, MAX_Y = 2025;
  var by = document.getElementById('by'), bm = document.getElementById('bm'), bd = document.getElementById('bd');
  function wareki(y) {
    if (y >= 2019) return y === 2019 ? '平成31・令和元' : '令和' + (y - 2018);
    if (y >= 1989) return y === 1989 ? '昭和64・平成元' : '平成' + (y - 1988);
    return '昭和' + (y - 1925);
  }
  function opt(sel, v, t) { var o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); }
  opt(by, '', '年を選ぶ');
  for (var y = MAX_Y; y >= MIN_Y; y--) opt(by, y, y + '年（' + wareki(y) + '年）');
  opt(bm, '', '月');
  for (var mm = 1; mm <= 12; mm++) opt(bm, mm, mm + '月');
  function fillDays() {
    var keep = bd.value, y = +by.value || 2000, m = +bm.value || 1;
    var n = new Date(y, m, 0).getDate();
    bd.innerHTML = ''; opt(bd, '', '日');
    for (var d = 1; d <= n; d++) opt(bd, d, d + '日');
    if (keep && +keep <= n) bd.value = keep;
  }
  fillDays();
  by.addEventListener('change', fillDays);
  bm.addEventListener('change', fillDays);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    var n = f.n.value.trim();
    if (!n) { err.textContent = 'お名前を入れてください'; f.n.focus(); return; }
    if (!by.value) { err.textContent = '生まれた年を選んでください'; by.focus(); return; }
    if (!bm.value) { err.textContent = '生まれた月を選んでください'; bm.focus(); return; }
    if (!bd.value) { err.textContent = '生まれた日を選んでください'; bd.focus(); return; }
    var d = by.value + '-' + pad(+bm.value) + '-' + pad(+bd.value);
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (avail) {
      var ok = avail.years.indexOf(+m[1]) >= 0 && avail.months.indexOf(m[1] + '-' + m[2]) >= 0 && avail.days.indexOf(m[2] + '-' + m[3]) >= 0;
      if (!ok) { err.textContent = 'この生年月日の紙面はただいま準備中です（順次ふやしています）'; return; }
    }
    var p = new URLSearchParams({ d: d, n: n });
    if (f.i.value.trim()) p.set('i', f.i.value.trim());
    if (f.m.value.trim()) p.set('m', f.m.value.trim());
    if (f.f.value.trim()) p.set('f', f.f.value.trim());
    location.href = 'paper.html?' + p.toString();
  });
})();
</script>
</body>
</html>
