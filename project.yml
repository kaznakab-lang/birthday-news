# お誕生日新聞 — XcodeGen の設定
#
# Windows には Xcode が無いので、.xcodeproj は git に入れない。
# Codemagic がビルドのたびに `xcodegen generate` でここから作る。
#
# **bundle id は `com.kutalabo.birthdaynews`。**
# `codemagic.yaml` の `bundle_identifier` も同じ値。片方だけ直すと必ずはまる。
#
# 紙面（paper.html・js・css・data）はリポジトリ直下のものをそのままアプリに入れる。
name: BirthdayNews

options:
  bundleIdPrefix: com.kutalabo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BirthdayNews:
    type: application
    platform: iOS
    sources:
      - path: BirthdayNews
      # 紙面（アプリの中で bnews://app/… として表示する）
      - path: paper.html
        buildPhase: resources
      - path: js
        type: folder
        buildPhase: resources
      - path: css
        type: folder
        buildPhase: resources
      - path: data
        type: folder
        buildPhase: resources
    info:
      path: BirthdayNews/Resources/Info.plist
      properties:
        # 暗号化の質問（輸出コンプライアンス・フランス）を毎回聞かれないようにする。HTTPSだけなので対象外。
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: 誕生日報
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # アイコンが無いと App Store Connect へのアップロードで弾かれる
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: ja
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kutalabo.birthdaynews
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  BirthdayNews:
    build:
      targets:
        BirthdayNews: all
    run:
      config: Debug
    archive:
      config: Release
